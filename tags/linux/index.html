<script>
    (function () {
        var root = document.documentElement;

        var toggle = document.getElementById("theme-toggle");
        if (toggle) {
            var media = window.matchMedia("(prefers-color-scheme: dark)");

            
            var isDark = function () {
                return root.dataset.theme === "dark" ||
                    (root.dataset.theme !== "light" && media.matches);
            };

            
            
            
            
            
            
            var relabel = function () {
                var next = isDark() ? toggle.dataset.toLight : toggle.dataset.toDark;
                if (!next) return;
                toggle.setAttribute("aria-label", next);
                toggle.title = next;
            };

            relabel();

            
            
            
            
            
            
            var snap = function (change) {
                root.classList.add("is-theme-switching");
                void root.offsetWidth;
                change();
                void root.offsetWidth;
                root.classList.remove("is-theme-switching");
            };

            toggle.addEventListener("click", function () {
                snap(function () {
                    root.dataset.theme = isDark() ? "light" : "dark";
                });
                try { localStorage.setItem("pref-theme", root.dataset.theme); } catch (e) { }
                relabel();
            });

            
            
            
            
            
            
            
            
            
            
            
            media.addEventListener("change", function () {
                root.classList.add("is-theme-switching");
                requestAnimationFrame(function () {
                    requestAnimationFrame(function () {
                        root.classList.remove("is-theme-switching");
                    });
                });
                relabel();
            });
        }

        var top = document.getElementById("top-link");
        if (top) {
            var onScroll = function () {
                top.classList.toggle("is-visible", window.scrollY > 800);
            };
            window.addEventListener("scroll", onScroll, { passive: true });
            onScroll();
        }
    })();
</script>
<script>
    (function () {
        var copy = "Copiar",
            copied = "Copiado",
            failed = "Copia fallida",
            label = "Copy code block {n}";

        
        
        
        
        
        
        
        var announce = document.createElement("p");
        announce.className = "visually-hidden";
        announce.setAttribute("role", "status");
        announce.setAttribute("aria-live", "polite");
        document.body.appendChild(announce);

        document.querySelectorAll(".content .highlight").forEach(function (block, i) {
            var code = block.querySelector("code");
            if (!code) return;
            var button = document.createElement("button");
            button.className = "copy-code";
            button.type = "button";
            button.textContent = copy;
            
            
            
            
            
            button.setAttribute("aria-label", label.replace("{n}", i + 1));

            var restore = function () {
                setTimeout(function () {
                    button.textContent = copy;
                    delete button.dataset.state;
                    
                    
                    
                    announce.textContent = "";
                }, 1500);
            };

            button.addEventListener("click", function () {
                
                
                
                var text = (block.querySelector("td:last-child code") || code).innerText;
                
                
                Promise.resolve()
                    .then(function () {
                        if (!navigator.clipboard) throw new Error("unavailable");
                        return navigator.clipboard.writeText(text);
                    })
                    .then(function () {
                        button.textContent = copied;
                        announce.textContent = copied;
                        restore();
                    })
                    .catch(function () {
                        button.textContent = failed;
                        button.dataset.state = "failed";
                        announce.textContent = failed;
                        restore();
                    });
            });
            block.appendChild(button);
        });
    })();
</script>
